## ==== Set of default key binding ========== 

# Reset to default prefix
set -g prefix C-b
unbind C-a
bind C-b send-prefix

# Default key bindings for tmux
unbind s
bind s choose-tree -s  # choose session

unbind w
bind w choose-window   # choose window

unbind f
bind f command-prompt "find-window '%%'"  # find window by name or content

## ========== End set default ==== 
## we can start adding custom key map below

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# use telescope-tmux for picking sessions and windows 
bind s display-popup -E -w 100% -h 100% nvim -c ":Telescope tmux sessions quit_on_select=true"
bind w display-popup -E -w 100% -h 100% nvim -c ":Telescope tmux windows quit_on_select=true"

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-sensible' # optional recommended
set -g @plugin 'catppuccin/tmux#v2.3.0' # pinned: v2 config API differs from v1

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# ==== Theme: catppuccin ====
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style 'basic' # basic, rounded, slanted, custom, none

# Status modules (the session tab) have their own caps, unrelated to the window style
# above; the plugin defaults them to the rounded glyph. Empty = basic.
# reverse swaps fg/bg, so this space is painted in the module's own icon color:
# inside-left padding for the block, without hardcoding any icon glyph
set -g @catppuccin_status_left_separator '#[reverse] #[none]'
set -g @catppuccin_status_right_separator ' '

# #W is the window name (rename with prefix + ,); the default #T is the pane title
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# 'text' renders tmux's raw #F flags: * current, Z zoomed, - last, ! bell
set -g @catppuccin_window_flags 'text'

# Modules are expanded lazily via #{E:...}, so this may sit above the tpm line.
# status-right must be cleared first: continuum prepends its save hook here on load.
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -ag status-left "#{E:@catppuccin_status_session}"
# #[default] resets to the bar's own style, so this gap is not painted in module colors
set -ag status-left "#[default] "
set -g status-right ""
# set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Must follow tpm: catppuccin sets message-style itself, and with a transparent
# status bar it hands the prompt bg=default, which draws over the status line.
# fill= paints the whole bar, bg= only the text cells; catppuccin omits fill,
# which is what leaves the rest of the status line showing through the prompt.
# Darker than @thm_peach (#fab387), which washed out against the dark prompt text
set -g @prompt_bg '#ef8f4e'
set -gF message-style "fg=#{@thm_crust},bg=#{@prompt_bg},fill=#{@prompt_bg},align=left"
set -gF message-command-style "fg=#{@thm_crust},bg=#{@prompt_bg},fill=#{@prompt_bg},align=left"

# Prompt cursor only — pane cursors are unaffected. Every mocha accent sits near
# luminance 0.7, the same as the bar, so a pastel cursor reads as white; go dark.
set -gF prompt-cursor-colour "#{@thm_crust}"
set -g prompt-cursor-style blinking-block
set -g prompt-command-cursor-style blinking-underline
